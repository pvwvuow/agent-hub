name: render-hub

# بازسازی خودکار صفحهٔ هاب از فایل‌های ایجنت‌ها و تسک‌ها:
#   README.md (بخش خودکار) + hub.json + docs/index.html (GitHub Pages)
# هر ساعت هم اجرا می‌شود تا نشانگر «بی‌نشانه»ها بدون commit تازه به‌روز بماند.

on:
  push:
    branches: [main]
    paths: ["agents/**", "roles/**", "tasks/**", "scripts/build.js"]
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: render-hub
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render hub
        run: node scripts/build.js

      - name: Commit rendered files
        run: |
          git config user.name "agent-hub-bot"
          git config user.email "action@users.noreply.github.com"
          git add README.md hub.json docs/index.html
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "render: hub page [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
